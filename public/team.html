<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teamflow · 多人協作</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./team.css"><script type="module" src="./team.js"></script></head><body class="team-body"><header class="team-header"><a class="brand" href="./">◈ teamflow</a><span>多人協作</span><a href="./">個人原型</a><span id="identity"></span><button id="signout" hidden>登出</button></header><div id="team-message" role="status"></div><div class="team-wrap"><section id="setup" class="settings-panel" hidden><h1>多人服務尚未設定</h1><p>需要先連接 Supabase 資料庫與帳號服務。原型資料不會自動上傳，請依儲存庫的 SETUP-TEAM.md 完成設定。</p><p>此頁尚未開放登入，並非已可多人共用。</p></section><section id="auth" class="settings-panel" hidden><h1>登入團隊空間</h1><p>每個人可建立自己的專案；共享須由擁有者授權。請先註冊、驗證 Email，再登入。</p><form id="auth-form"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>密碼<input type="password" name="password" autocomplete="current-password" minlength="12" required></label><button class="primary" type="submit">登入</button> <button class="secondary" type="button" id="signup">註冊新帳號</button></form><p class="fine">新帳號密碼至少 12 字。驗證信由帳號服務寄送，與任務通知無關。</p></section><div id="workspace" hidden><div class="team-heading"><div><h1>我的專案與共享專案</h1><p>變更立即生效並留存紀錄。由擁有者審閱，還原不刪除歷史。</p></div><button class="primary" id="new-project">＋ 建立專案</button></div><div class="team-layout"><nav id="shared-projects" aria-label="專案"></nav><div id="shared-detail"><p>請建立或選擇專案。</p></div></div></div></div><dialog id="shared-editor"><form id="shared-form"><div class="dialog-heading"><h2 id="shared-title"></h2><button class="close" type="button" id="close-editor">×</button></div><div id="shared-fields"></div><label>變更原因<input name="reason" maxlength="1000" required placeholder="請說明本次新增或修改的原因"></label><button class="primary" type="submit">儲存並留下紀錄</button></form></dialog></body></html>
